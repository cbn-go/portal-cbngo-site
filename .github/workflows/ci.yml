name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check code style
        run: composer lint

      - name: Static analysis
        run: composer phpstan

      - name: Run tests
        run: composer test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REMOTE_ROOT: /home/u579305537/domains/cbngo.org.br
      SITE_URL: https://cbngo.org.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
          coverage: none
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Composer production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Sync application (never overwrite .env, never migrate)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          RSYNC_SSH="ssh -p $HOSTINGER_PORT -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_ed25519"
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'tmp/' \
            --exclude 'public/' \
            --exclude 'public_html/' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/cache/data/*' \
            --exclude 'storage/framework/views/*' \
            --exclude 'database/database.sqlite' \
            ./ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${REMOTE_ROOT}/"
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            public/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${REMOTE_ROOT}/public_html/"

      - name: Rebuild Laravel caches on the server
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -p "$HOSTINGER_PORT" -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "cd ${REMOTE_ROOT} && rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php && /opt/alt/php83/usr/bin/php artisan view:clear && /opt/alt/php83/usr/bin/php artisan config:cache && /opt/alt/php83/usr/bin/php artisan route:cache && /opt/alt/php83/usr/bin/php artisan view:cache"

      - name: Check /health after deploy
        run: |
          for attempt in 1 2 3; do
            curl -fsS --max-time 30 "${SITE_URL}/health" | grep -q '"status":"ok"' && exit 0
            sleep 10
          done
          echo "O portal não respondeu /health em ${SITE_URL} depois do deploy." >&2
          exit 1
